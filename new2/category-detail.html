<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Details | Ammachies</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .category-detail-container {
            padding: 8rem 2rem 4rem;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 80vh;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #001a40;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 3rem;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.6;
        }

        .category-header {
            margin-bottom: 4rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 2rem;
        }

        .category-header h1 {
            font-size: 2.5rem;
            color: #001a40;
            margin-bottom: 1rem;
        }

        .category-header p {
            font-size: 1rem;
            color: #666;
            max-width: 700px;
        }

        .product-list-detailed {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .product-item-detailed {
            border-left: 3px solid #001a40;
            padding-left: 2rem;
        }

        .product-item-detailed h2 {
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            color: #333;
        }

        .product-item-detailed p {
            font-size: 0.9rem;
            line-height: 1.8;
            color: #555;
        }

        @media (max-width: 768px) {
            .category-detail-container {
                padding: 6rem 1.5rem 3rem;
            }

            .category-header h1 {
                font-size: 2rem;
            }

            .product-item-detailed {
                padding-left: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html"><img src="logo.png" alt="Ammachies Logo"></a>
            </div>
            <ul>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#categories">Categories</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="category-detail-container">
            <a href="index.html#categories" class="back-link">← Back to Categories</a>

            <div id="category-content">
                <!-- Content will be injected by JavaScript -->
                <div class="category-header">
                    <h1 id="cat-name">Loading...</h1>
                    <p id="cat-desc"></p>
                </div>

                <div id="product-list" class="product-list-detailed">
                    <!-- Products will lead here -->
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 AMMACHIES. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script>
        <script>
            async function loadCategory() {
            const urlParams = new URLSearchParams(window.location.search);
            const catId = urlParams.get('id');

            if (!catId) {
                window.location.href = 'index.html#categories';
            return;
            }

            try {
                const response = await fetch('data.json');
            const data = await response.json();
                const category = data.categories.find(c => c.id === catId);

            if (category) {
                document.title = (category.name || 'Category') + ' | Ammachies';
            document.getElementById('cat-name').textContent = category.name;
            document.getElementById('cat-desc').textContent = category.desc || 'Explore our wide range of authentic Kerala products in this category.';

            const listContainer = document.getElementById('product-list');
            listContainer.innerHTML = ''; // Clear existing

                    // Use the 'products' array if available (rich details), else fall back to 'items' (string list)
                    if (category.products && category.products.length > 0) {
                category.products.forEach(p => {
                    const item = document.createElement('div');
                    item.className = 'product-item-detailed';
                    item.innerHTML = `
                                <h2>${p.name}</h2>
                                <p>${p.desc}</p>
                            `;
                    listContainer.appendChild(item);
                });
                    } else if (category.items && category.items.length > 0) {
                        // Fallback for categories with only simple item lists
                         const item = document.createElement('div');
            item.className = 'product-item-detailed';
            item.innerHTML = `
            <h2>Products in this category:</h2>
            <ul style="margin-top: 10px; padding-left: 20px;">
                ${category.items.map(i => `<li>${i}</li>`).join('')}
            </ul>
                        `;
                        listContainer.appendChild(item);
                    } else {
                        listContainer.innerHTML = '<p>No products found in this category.</p>';
                    }
                } else {
                     document.body.innerHTML = '<div style="text-align:center; padding: 5rem;"><h1>Category Not Found</h1><a href="index.html">Go Home</a></div>';
                }
            } catch (error) {
                console.error('Error loading category:', error);
                 document.body.innerHTML = '<div style="text-align:center; padding: 5rem;"><h1>Error Loading Category</h1><p>Please try again later.</p></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadCategory);
    </script>
</body>

</html>
