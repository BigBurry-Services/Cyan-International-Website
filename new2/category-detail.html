    <style>
        .category-detail-container {
            padding: 8rem 2rem 4rem;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 80vh;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #001a40;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 3rem;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.6;
        }

        .category-header {
            margin-bottom: 4rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 2rem;
        }

        .category-header h1 {
            font-size: 2.5rem;
            color: #001a40;
            margin-bottom: 1rem;
        }

        .category-header p {
            font-size: 1rem;
            color: #666;
            max-width: 700px;
        }

        .product-list-detailed {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .product-item-detailed {
            border-left: 3px solid #001a40;
            padding-left: 2rem;
        }

        .product-item-detailed h2 {
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            color: #333;
        }

        .product-item-detailed p {
            font-size: 0.9rem;
            line-height: 1.8;
            color: #555;
        }

        @media (max-width: 768px) {
            .category-detail-container {
                padding: 6rem 1.5rem 3rem;
            }

            .category-header h1 {
                font-size: 2rem;
            }

            .product-item-detailed {
                padding-left: 1.5rem;
            }
        }
    </style>
</head>

            data.products.forEach(p => {
