<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Ammachies</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .detail-container {
            padding: 10rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 4rem;
        }

        .detail-image img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 1px solid #eee;
            border-radius: 15px;
        }

        .detail-content h1 {
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
        }

        .detail-content .description {
            font-size: 0.8rem;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        .info-section {
            margin-bottom: 2.5rem;
        }

        .info-section h3 {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .info-section p {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            text-decoration: none;
            color: #000;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 2px solid #000;
        }

        @media (max-width: 768px) {
            .detail-container {
                grid-template-columns: 1fr;
                padding: 6rem 2rem;
            }

            .detail-content h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html"><img src="logo.png" alt="Ammachies Logo"></a>
            </div>
            <ul>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#products">Products</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="detail-container">
            <div class="detail-image">
                <img id="product-img" src="" alt="Product Image">
            </div>
            <div class="detail-content">
                <a href="index.html#products" class="back-btn">← Back to Products</a>
                <h1 id="product-name">PRODUCT NAME</h1>

                <div class="info-section">
                    <h3>DESCRIPTION</h3>
                    <p id="product-desc" class="description">Long description goes here...</p>
                </div>

                <div class="info-section">
                    <h3>INGREDIENTS</h3>
                    <p id="product-ingredients">Ingredient list goes here...</p>
                </div>

                <div class="info-section">
                    <h3>SHELF LIFE</h3>
                    <p id="product-shelf">6 Months</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 AMMACHIES. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script>
        async function loadProduct() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                window.location.href = 'index.html#products';
                return;
            }

            try {
                const response = await fetch('data.json');
                const data = await response.json();
                const product = data.products.find(p => p.id === productId);

                if (product) {
                    document.title = (product.name || 'Product Details') + ' | Ammachies';
                    document.getElementById('product-name').textContent = (product.name || 'Unknown Product').toUpperCase();

                    const img = document.getElementById('product-img');
                    img.src = product.image || 'placeholder.png'; // Fallback if image missing
                    img.alt = product.name;

                    document.getElementById('product-desc').textContent = product.desc || 'Premium quality Kerala food product. Processed and packed with care to ensure authentic taste and freshness.';
                    document.getElementById('product-ingredients').textContent = product.ingredients || 'Natural Ingredients.';
                    document.getElementById('product-shelf').textContent = product.shelf || 'Best before 6 months from packaging (Frozen).';
                } else {
                    document.body.innerHTML = '<div style="text-align:center; padding: 5rem;"><h1>Product Not Found</h1><a href="index.html">Go Home</a></div>';
                }
            } catch (error) {
                console.error('Error loading product:', error);
                document.body.innerHTML = '<div style="text-align:center; padding: 5rem;"><h1>Error Loading Product</h1><p>Please try again later.</p></div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProduct);
    </script>
</body>

</html>
