<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Ammachies</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        .detail-container {
            padding: 10rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 4rem;
        }

        .detail-image img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 1px solid #eee;
            border-radius: 15px;
        }

        .detail-content h1 {
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
        }

        .detail-content .description {
            font-size: 0.8rem;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        .info-section {
            margin-bottom: 2.5rem;
        }

        .info-section h3 {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .info-section p {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            text-decoration: none;
            color: #000;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 2px solid #000;
        }

        @media (max-width: 768px) {
            .detail-container {
                grid-template-columns: 1fr;
                padding: 6rem 2rem;
            }

            .detail-content h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html"><img src="logo.png" alt="Ammachies Logo"></a>
            </div>
            <ul>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#products">Products</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="detail-container">
            <div class="detail-image">
                <img id="product-img" src="" alt="Product Image">
            </div>
            <div class="detail-content">
                <a href="index.html#products" class="back-btn">← Back to Products</a>
                <h1 id="product-name">PRODUCT NAME</h1>

                <div class="info-section">
                    <h3>DESCRIPTION</h3>
                    <p id="product-desc" class="description">Long description goes here...</p>
                </div>

                <div class="info-section">
                    <h3>INGREDIENTS</h3>
                    <p id="product-ingredients">Ingredient list goes here...</p>
                </div>

                <div class="info-section">
                    <h3>SHELF LIFE</h3>
                    <p id="product-shelf">6 Months</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 AMMACHIES. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script>
        const products = {
            'cassava': {
                name: 'FRESH CASSAVA',
                img: 'products/cassava.png',
                desc: 'Our Fresh Cassava is sourced from the finest plantations in Kerala, where the rich soil and tropical climate produce the best roots. We process our cassava within hours of harvesting to ensure it retains its natural starchiness and earthy flavor. Prefectly cleaned and cut, it\'s ready for boiling or frying, serving as a staple in traditional Kerala meals.',
                ingredients: '100% Premium Kerala Cassava.',
                shelf: '6 Months (Frozen)'
            },
            'coconut': {
                name: 'GRATED COCONUT',
                img: 'products/grated coconut.png',
                desc: 'Freshly harvested coconuts from the sun-drenched groves of Kerala, grated to perfection and flash-frozen to lock in the natural milky sweetness, rich aroma, and moisture. Our product is 100% natural, with no added water or preservatives. It\'s the perfect time-saver for busy kitchens, essential for traditional chutneys, thorans, and aviyals.',
                ingredients: '100% Natural Kerala Coconut.',
                shelf: '12 Months (Frozen)'
            },
            'kadala': {
                name: 'KADALA VARUTHARA CURRY',
                img: 'products/kadala varuthara curry.png',
                desc: 'A quintessential Kerala breakfast companion, our Kadala Varuthara Curry features tender black chickpeas slow-cooked in a rich, deeply flavored gravy of roasted coconut and aromatic spices. The "Varuthara" technique creates a complex smoky flavor that is unique to traditional Malayali cooking.',
                ingredients: 'Black Chickpeas, Roasted Coconut, Shallots, Ginger, Garlic, traditional Spice Blend.',
                shelf: '12 Months (Frozen)'
            },
            'koorkka': {
                name: 'KOORKKA STIR-FRY',
                img: 'products/koorkka mezhukkuppuratty.png',
                desc: 'Koorkka, or Chinese Potato, is a beloved seasonal treasure in Kerala. Our stir-fry is prepared in the authentic village style, where the earthy tubers are sautéed with crushed shallots, garlic, and red chilies in pure coconut oil.',
                ingredients: 'Chinese Potato (Koorkka), Shallots, Coconut Oil, Garlic, Chili, Turmeric.',
                shelf: '6 Months (Frozen)'
            },
            'mambazha': {
                name: 'MAMBAZHA CURRY',
                img: 'products/mambazhacurry.png',
                desc: 'Celebrating the mango season of Kerala, this sweet and sour dish features ripe local mangoes simmered in a yogurt and coconut base flavored with cumin and green chilies. It\'s a cooling and utterly delicious accompaniment to red rice.',
                ingredients: 'Ripe Mangoes, Thick Curd, Coconut, Green Chilies, Cumin, Turmeric.',
                shelf: '12 Months (Frozen)'
            },
            'sweet': {
                name: 'SWEET CURRY',
                img: 'products/sweet curry.png',
                desc: 'A festive preparation combining the goodness of legumes with the rich, caramel sweetness of jaggery and creamy coconut milk. Fragrant with cardamom and ginger, it bridges the gap between a side dish and a dessert.',
                ingredients: 'Pulses/Tubers, Jaggery, Coconut Milk, Cardamom, Dry Ginger.',
                shelf: '12 Months (Frozen)'
            },
            'ulli': {
                name: 'ULLI THEEYAL',
                img: 'products/ulli theeyal.png',
                desc: 'A masterclass in the roasted coconut technique. Small pearl onions are caramelized and simmered in a thick, tangy sauce made from highly roasted coconut and tamarind. It\'s one of the most sophisticated vegetarian curries of the region.',
                ingredients: 'Shallots, Roasted Coconut, Tamarind, Coriander, Red Chili, Fenugreek.',
                shelf: '12 Months (Frozen)'
            },
            'stew': {
                name: 'VEGETABLES STEW',
                img: 'products/vegetables stew.png',
                desc: 'A delicate and aromatic preparation where potatoes, carrots, and beans are gently poached in creamy coconut milk flavored with whole spices like cinnamon and cloves. The legendary companion to lace-soft Appams.',
                ingredients: 'Potato, Carrot, Beans, Coconut Milk, Ginger, Whole Spices.',
                shelf: '12 Months (Frozen)'
            },
            'beetroot': {
                name: 'BEETROOT PACHADI',
                img: 'products/beetroot pachadi.png',
                desc: 'A vibrant and colorful Kerala delicacy, our Beetroot Pachadi is a yogurt-based accompaniment that perfectly balances the earthy sweetness of fresh beets with the tang of curd and the aroma of coconut and mustard.',
                ingredients: 'Beetroot, Thick Curd, Coconut, Mustard Seeds, Ginger, Curry Leaves.',
                shelf: '6 Months (Frozen)'
            },
            'cheera': {
                name: 'CHEERA THORAN',
                img: 'products/cheera thoran green.png',
                desc: 'A staple in every Malayali household, our Cheera Thoran (Spinach Stir-fry) captures the essence of home cooking. Fresh green spinach is finely chopped and sautéed with grated coconut, shallots, and green chilies.',
                ingredients: 'Spinach (Cheera), Grated Coconut, Shallots, Green Chilies, Coconut Oil, Mustard.',
                shelf: '6 Months (Frozen)'
            },
            'cucumber': {
                name: 'CUCUMBER PACHADI',
                img: 'products/cucumber pachadi.png',
                desc: 'A refreshing and cooling side dish, essential for a traditional Kerala Sadya. Our Cucumber Pachadi combines crisp, finely chopped cucumbers with a spiced coconut-yogurt base, tempered with mustard and curry leaves.',
                ingredients: 'Cucumber, Thick Curd, Coconut, Mustard Seeds, Green Chilies, Ginger.',
                shelf: '6 Months (Frozen)'
            },
            'mangomappas': {
                name: 'MANGO MAPPAS',
                img: 'products/mango mappas.png',
                desc: 'Mango Mappas is a luscious, creamy curry where ripe mangoes are slow-cooked in a rich coconut milk base infused with a unique blend of Kerala spices. It offers a perfect harmony of sweet, spicy, and creamy flavors.',
                ingredients: 'Ripe Mangoes, Coconut Milk, Ginger, Garlic, Cardamom, Cloves, Cinnamon, Turmeric.',
                shelf: '12 Months (Frozen)'
            },
            'pumpkin': {
                name: 'PUMPKIN ERISSERY',
                img: 'products/pumpkin erissery.png',
                desc: 'A classic Kerala dish featuring sweet yellow pumpkin and cowpeas cooked in a roasted coconut sauce. The dish is topped with deeply browned coconut flakes, adding a delightful crunch and nutty aroma.',
                ingredients: 'Yellow Pumpkin, Cowpeas (Vanpayar), Roasted Coconut, Black Pepper, Cumin, Turmeric.',
                shelf: '12 Months (Frozen)'
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const product = products[productId];

        if (product) {
            document.title = product.name + ' | Ammachies';
            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-img').src = product.img;
            document.getElementById('product-img').alt = product.name;
            document.getElementById('product-desc').textContent = product.desc;
            document.getElementById('product-ingredients').textContent = product.ingredients;
            document.getElementById('product-shelf').textContent = product.shelf;
        } else {
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
