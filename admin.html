<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Ammachies Management</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #f8f9fa;
        }

        .admin-nav {
            background: var(--primary-color);
            color: white;
            padding: 15px 0;
            margin-bottom: 40px;
        }

        .admin-nav .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 30px;
        }

        .product-list-table {
            width: 100%;
            border-collapse: collapse;
        }

        .product-list-table th,
        .product-list-table td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .product-list-table th {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            /* Prevent modal from being too tall */
            overflow-y: auto;
            /* Allow scrolling within modal */
        }

        .modal-header {
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            gap: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: var(--font-body);
        }
    </style>
</head>

<body>
    <nav class="admin-nav">
        <div class="admin-container nav-container">
            <div class="logo">
                <img src="logo.png" alt="Ammachies Logo" style="height: 40px; width: auto;">
            </div>
            <a href="#" id="logout-btn" style="font-weight: 600;">Logout</a>
        </div>
    </nav>

    <div class="admin-container">
        <div class="dashboard-header">
            <h2>Product Management</h2>
            <div class="header-actions">
                <button class="btn btn-accent" id="manage-categories-btn" style="margin-right: 10px;">Manage
                    Categories</button>
                <button class="btn btn-primary" id="add-product-btn">+ Add New Product</button>
            </div>
        </div>

        <div class="category-filter reveal" style="margin-bottom: 30px; justify-content: flex-start;">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="Frozen">Frozen</button>
            <button class="filter-btn" data-category="Snacks">Snacks</button>
            <button class="filter-btn" data-category="Traditional">Traditional</button>
        </div>

        <div class="card">
            <table class="product-list-table">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Weight/Size</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="product-tbody">
                    <!-- Products will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add Product</h3>
            </div>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="p-name" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="p-category">
                            <!-- Categories will be injected here -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Weight/Size</label>
                        <input type="text" id="p-weight" placeholder="e.g. 454g">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="p-desc" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" id="p-img" placeholder="https://...">
                    </div>
                    <div class="action-btns" style="margin-top: 10px;">
                        <button type="submit" class="btn btn-primary" style="flex:1">Save Product</button>
                        <button type="button" class="btn" id="close-modal"
                            style="background:#eee; flex:1">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Category Modal -->
    <div class="modal" id="category-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Manage Categories</h3>
            </div>
            <div class="form-grid">
                <div class="form-group" style="display:flex; gap:10px;">
                    <input type="text" id="new-category-input" placeholder="New Category Name">
                    <button class="btn btn-primary" id="add-category-btn">Add</button>
                </div>
                <div style="max-height: 300px; overflow-y: auto; margin-top: 15px;">
                    <table class="product-list-table">
                        <thead>
                            <tr>
                                <th>Category Name</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="category-tbody">
                            <!-- Categories injected here -->
                        </tbody>
                    </table>
                </div>
                <div class="action-btns" style="margin-top: 20px;">
                    <button type="button" class="btn" id="close-category-modal"
                        style="background:#eee; flex:1">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
